name: Repair branch verification

on:
  pull_request:
    branches:
      - integration/stage-4-combined

concurrency:
  group: verane-repair-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/storefront-schema-repair
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate a forward migration from the preserved migration history
        run: npm run db:generate

      - name: Confirm the forward migration history exists
        run: node -e 'const j = JSON.parse(require("node:fs").readFileSync("drizzle/meta/_journal.json", "utf8")); if (j.entries.length < 3) { console.error("Drizzle did not append a forward migration"); process.exit(1); }'

      - name: Verify the schema migration is committed
        run: |
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "::error::Drizzle generated an uncommitted migration. Review and commit it explicitly."
            git status --short -- drizzle
            exit 1
          fi
          echo "Committed migration history matches the schema."

      - name: Prepare disposable SQLite database for build
        env:
          SESSION_SECRET: ci-only-session-secret-not-for-production-1234567890
          TOKEN_PEPPER: ci-only-token-pepper-not-for-production-1234567890
          DATABASE_URL: file:./ci.db
        run: npm run db:migrate && npm run db:seed

      - name: Run project checks
        id: project-check
        continue-on-error: true
        env:
          SESSION_SECRET: ci-only-session-secret-not-for-production-1234567890
          TOKEN_PEPPER: ci-only-token-pepper-not-for-production-1234567890
          DATABASE_URL: file:./ci.db
        run: npm run check

      - name: Run offline tests
        id: offline-tests
        if: always()
        continue-on-error: true
        run: npm run test:offline

      - name: Summarize verification
        if: always()
        run: |
          {
            echo "## Repair branch verification"
            echo "- npm run check: ${{ steps.project-check.outcome }}"
            echo "- npm run test:offline: ${{ steps.offline-tests.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.project-check.outcome }}" != "success" ] || [ "${{ steps.offline-tests.outcome }}" != "success" ]; then
            exit 1
          fi
