name: Repair branch verification

on:
  push:
    branches:
      - fix/storefront-schema-repair
  pull_request:
    branches:
      - integration/stage-4-combined

concurrency:
  group: verane-repair-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/storefront-schema-repair
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate a clean baseline migration from the canonical schema
        run: npx drizzle-kit generate --config=drizzle.fresh.config.ts --name=canonical-schema

      - name: Commit generated migration if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- drizzle_generated)" ]; then
            git add drizzle_generated
            git commit -m "chore(db): generate canonical schema snapshot"
            git push origin HEAD:fix/storefront-schema-repair
          else
            echo "Canonical schema baseline already exists."
          fi

      - name: Run project checks
        id: project-check
        continue-on-error: true
        run: npm run check

      - name: Run offline tests
        id: offline-tests
        if: always()
        continue-on-error: true
        run: npm run test:offline

      - name: Summarize verification
        if: always()
        run: |
          {
            echo "## Repair branch verification"
            echo "- npm run check: ${{ steps.project-check.outcome }}"
            echo "- npm run test:offline: ${{ steps.offline-tests.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.project-check.outcome }}" != "success" ] || [ "${{ steps.offline-tests.outcome }}" != "success" ]; then
            exit 1
          fi
