name: Repair branch verification

on:
  pull_request:
    branches:
      - integration/stage-4-combined

concurrency:
  group: verane-repair-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate a forward migration from the preserved migration history
        run: npm run db:generate

      - name: Capture generated Drizzle migration for repair
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drizzle-generated-diff
          path: |
            drizzle/0005_*.sql
            drizzle/meta/0005_snapshot.json
          if-no-files-found: ignore

      - name: Confirm the forward migration history exists
        run: node -e 'const j = JSON.parse(require("node:fs").readFileSync("drizzle/meta/_journal.json", "utf8")); if (j.entries.length < 3) { console.error("Drizzle did not append a forward migration"); process.exit(1); }'

      - name: Reconcile the V1 parity migration snapshot
        run: |
          generated_sql="$(find drizzle -maxdepth 1 -name '0005_*.sql' -print -quit)"
          generated_snapshot="drizzle/meta/0005_snapshot.json"
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            if [ -z "$generated_sql" ] || [ ! -f "$generated_snapshot" ]; then
              echo "::error::Drizzle reported schema drift but its generated migration/snapshot could not be found."
              git status --short -- drizzle
              exit 1
            fi
            # The parity migration was initially added without a Drizzle snapshot.
            # Squash the generated forward diff into the single forward migration
            # so fresh databases apply each column/table exactly once.
            cp "$generated_sql" drizzle/0003_v1_parity_features.sql
            cp "$generated_snapshot" drizzle/meta/0003_snapshot.json
            rm -f drizzle/0004_cart_custom_measurements.sql "$generated_sql" "$generated_snapshot"
            node -e 'const fs=require("node:fs");const p="drizzle/meta/_journal.json";const j=JSON.parse(fs.readFileSync(p,"utf8"));j.entries=j.entries.filter(e=>e.idx<4);fs.writeFileSync(p,JSON.stringify(j,null,2)+"\n");'
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A drizzle
            git commit -m "Align V1 parity migration and snapshot"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "::error::Migration reconciliation left uncommitted Drizzle files."
            git status --short -- drizzle
            exit 1
          fi
          echo "Committed migration history matches the schema."

      - name: Prepare disposable SQLite database for build
        env:
          SESSION_SECRET: ci-only-session-secret-not-for-production-1234567890
          TOKEN_PEPPER: ci-only-token-pepper-not-for-production-1234567890
          SEED_ADMIN_PASSWORD: ci-only-seed-password-not-for-production-1234567890
          DATABASE_URL: file:./ci.db
        run: npm run db:migrate && npm run db:seed

      - name: Run project checks
        id: project-check
        continue-on-error: true
        env:
          SESSION_SECRET: ci-only-session-secret-not-for-production-1234567890
          TOKEN_PEPPER: ci-only-token-pepper-not-for-production-1234567890
          DATABASE_URL: file:./ci.db
        run: npm run check

      - name: Run offline tests
        id: offline-tests
        if: always()
        continue-on-error: true
        run: npm run test:offline

      - name: Summarize verification
        if: always()
        run: |
          {
            echo "## Repair branch verification"
            echo "- npm run check: ${{ steps.project-check.outcome }}"
            echo "- npm run test:offline: ${{ steps.offline-tests.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.project-check.outcome }}" != "success" ] || [ "${{ steps.offline-tests.outcome }}" != "success" ]; then
            exit 1
          fi
