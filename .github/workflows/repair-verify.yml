name: VÉRANE verification

on:
  pull_request:
    branches:
      - integration/stage-4-combined
      - feat/v1-parity-commerce
  push:
    branches:
      - integration/stage-4-combined
      - feat/v1-parity-commerce

concurrency:
  group: verane-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify migration journal matches committed SQL files
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const journal = JSON.parse(fs.readFileSync("drizzle/meta/_journal.json", "utf8"));
          const expected = new Set(journal.entries.map((entry) => `${entry.tag}.sql`));
          const actual = fs.readdirSync("drizzle").filter((file) => /^\d{4}_.+\.sql$/.test(file));
          const missing = [...expected].filter((file) => !actual.includes(file));
          const unregistered = actual.filter((file) => !expected.has(file));
          if (missing.length || unregistered.length) {
            console.error({ missing, unregistered });
            process.exit(1);
          }
          console.log(`Verified ${actual.length} committed SQL migrations.`);
          NODE

      - name: Diagnose committed migrations statement by statement
        run: npx tsx scripts/diagnose-migrations.ts

      - name: Apply migrations and seed disposable SQLite database
        env:
          SESSION_SECRET: ci-only-session-secret-not-for-production-1234567890
          TOKEN_PEPPER: ci-only-token-pepper-not-for-production-1234567890
          SEED_ADMIN_PASSWORD: ci-only-seed-password-not-for-production-1234567890
          DATABASE_URL: file:./ci.db
        run: npm run db:migrate && npm run db:seed

      - name: Typecheck, lint, integration tests and production build
        env:
          SESSION_SECRET: ci-only-session-secret-not-for-production-1234567890
          TOKEN_PEPPER: ci-only-token-pepper-not-for-production-1234567890
          SEED_ADMIN_PASSWORD: ci-only-seed-password-not-for-production-1234567890
          DATABASE_URL: file:./ci.db
        run: npm run check

      - name: Run offline tests
        run: npm run test:offline
